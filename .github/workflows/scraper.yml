name: Scraping settimanale capienze carceri

on:
  schedule:
    # GitHub fa partire i cron "quando può": ritardi di ore sono normali, per
    # questo non si controlla l'orario di esecuzione. Che il job parta alle 8
    # o alle 13 non cambia nulla: i dati di capienza sono giornalieri e lo
    # script è idempotente per data. Basta quindi un solo cron, a un minuto
    # poco affollato per ridurre il ritardo.
    - cron: "23 6 * * 1"   # lunedì mattina (8:23 con ora legale, 7:23 con ora solare)
  workflow_dispatch: {}    # consente anche il lancio manuale dal sito

permissions:
  contents: write

# Evita che due esecuzioni si sovrappongano e scrivano righe doppie.
concurrency:
  group: scraping-capienze
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo scraping
        run: python scraper_capienze.py

      - name: Salva il CSV aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storico_capienze.csv
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Rilevazione capienze del $(TZ=Europe/Rome date +%d/%m/%Y)"
            git pull --rebase
            git push
          fi
